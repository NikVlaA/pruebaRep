name: CI-CD mundial2026

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mundial2026
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generar etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Actualizar imagen en Kubernetes
        shell: powershell
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $image = "${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-$sha"
          kubectl set image deployment/${{ env.IMAGE_NAME }} ${{ env.IMAGE_NAME }}=$image

      - name: Esperar a que termine el rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} --timeout=30s

      - name: Verificar el despliegue
        shell: powershell
        run: |
          kubectl get deployment ${{ env.IMAGE_NAME }}
          kubectl get pods -l app=${{ env.IMAGE_NAME }}
          kubectl get events --sort-by='.lastTimestamp' | Select-Object -Last 10
